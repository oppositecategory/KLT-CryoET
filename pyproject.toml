[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kltpicker-3d"
version = "0.1.0"
description = "Three-dimensional KLT particle picking for cryo-electron tomography"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.20",
    "mrcfile>=1.5",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "tqdm>=4.66",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
]
dev = [
    "pre-commit>=4.0",
    "pyrefly>=1.0",
    "pytest>=7.4",
    "ruff>=0.15",
]

[tool.setuptools]
packages = ["kltpicker_3d"]

[tool.pytest.ini_options]
testpaths = ["kltpicker_3d/tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
indent-width = 4
include = ["kltpicker_3d/**/*.py"]

[tool.ruff.lint]
select = [
    "ANN",  # flake8-annotations
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle
    "E4",   # pycodestyle imports
    "E7",   # pycodestyle statements
    "E9",   # pycodestyle runtime errors
    "F",    # Pyflakes
    "I",    # isort
    "ICN",  # flake8-import-conventions
    "N",    # pep8-naming
    "PIE",  # flake8-pie
    "RUF",  # Ruff-specific rules
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
"kltpicker_3d/tests/**/*.py" = ["ANN", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pep8-naming]
ignore-names = ["G", "Gx", "K", "L", "N"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.pyrefly]
project-includes = ["kltpicker_3d"]
project-excludes = ["kltpicker_3d/tests"]
python-version = "3.10"
preset = "default"
check-unannotated-defs = true
infer-return-types = "checked"
